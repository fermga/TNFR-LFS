name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Studio/Qt tests run headless on Linux via Qt's "offscreen"
        # platform. Windows is the primary target for the packaged app,
        # so we also smoke-test there on one Python version.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"

    env:
      QT_QPA_PLATFORM: offscreen
      # PySide6/pyqtgraph emit harmless "ViewBox should be closed before
      # application exit" warnings on shutdown; suppress as noise.
      PYTHONWARNINGS: "ignore::DeprecationWarning"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Qt needs an OpenGL stack + XKB even in offscreen mode on Ubuntu.
      - name: Install Linux Qt system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxcb-cursor0 \
            libdbus-1-3 libfontconfig1

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest -q
