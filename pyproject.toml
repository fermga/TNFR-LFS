[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfs-race-engineer"
version = "0.5.2"
description = "Live-for-Speed real-time telemetry capture and Studio race-engineer overlay."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LFS Race Engineer contributors" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    # Studio tests (tests/studio/*) instantiate Qt widgets, which
    # transitively import pyqtgraph and PySide6. Listing them here lets
    # contributors run `pip install -e ".[dev]"` and have a green test
    # suite without remembering to also pass `studio`.
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
]
studio = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
]
vr = [
    "openvr>=1.26 ; sys_platform == 'win32'",
]
build = [
    "pyinstaller>=6.6",
    # Bundle the VR mirror into the shipped .exe. The PyInstaller spec
    # only packages ``openvr`` when it is importable at build time, so
    # pin it here to guarantee SteamVR/OpenVR support in released builds
    # (Windows-only, matching the ``vr`` extra).
    "openvr>=1.26 ; sys_platform == 'win32'",
]
# Stand-alone matplotlib viewers under scripts/ and tools/
# (motec_view, racing_line_view, track_view, wheel_view,
# tools/full_lap_plots). Not needed by the Studio GUI or the
# packaged installer; opt-in via `pip install -e ".[scripts]"`.
scripts = [
    "matplotlib>=3.7",
]

[project.scripts]
lfs-telemetry = "lfs_telemetry.cli:main"
lfs-race-engineer = "lfs_telemetry.studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as an asyncio coroutine (handled by pytest-asyncio)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "ERA", "ASYNC"]
# Project uses Greek letters (νf, ΔNFR) per TNFR canonical notation and
# Spanish prose in i18n tables; the RUF00x ambiguous-unicode family is
# noise here. ERA001 (commented-out code) is too aggressive given the
# annotated physics derivations in several modules.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "ERA001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# Dev/diagnostic scripts in tools/ and scripts/ use ad-hoc one-liners
# (semicolons, single-letter loop vars, try/except/pass for best-effort
# parsing of unknown binary layouts) that don't justify a refactor.
[tool.ruff.lint.per-file-ignores]
"tools/**/*.py" = ["E702", "E741", "RUF059", "B905"]
"scripts/**/*.py" = ["E702", "SIM105", "F841"]

# TG3 — gradual mypy. Advisory only: missing imports and untyped defs are
# permitted while we incrementally add annotations. Enable stricter knobs
# (`disallow_untyped_defs`, `no_implicit_optional`) per-module as coverage
# improves.
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
follow_imports = "silent"
exclude = [
    "build/",
    "dist/",
    "installer/Output/",
    "tools/",
    "scripts/",
    "tests/",
]
